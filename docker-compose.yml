# Brings up the Smart-X ingestion gateway (API) and configuration dashboard (Client)
# together. Run with:  docker compose up --build
#
# Note: the Client's ApiBaseUrl is a browser-visible URL (http://localhost:5050), not the
# internal Docker network address - all API calls are made client-side, from JavaScript
# running in the user's browser, not server-to-server between the two containers.

services:
  smartx-api:
    build:
      context: ./src
      dockerfile: SmartX.Api/Dockerfile
    container_name: smartx-api
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedClientOrigins__0=http://localhost:5100
    volumes:
      - smartx-uploads:/app/App_Data/uploads
    restart: unless-stopped

  smartx-client:
    build:
      context: ./src
      dockerfile: SmartX.Client/Dockerfile
    container_name: smartx-client
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://localhost:5050
    depends_on:
      - smartx-api
    restart: unless-stopped

volumes:
  smartx-uploads:
