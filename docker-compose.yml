# Brings up the Smart-X gateway (API), the simulated device fleet, and the dashboard (Client).
# Run with:  docker compose up --build
#
# The Client's ApiBaseUrl is a browser-visible URL (http://localhost:5050): its API calls come from
# JavaScript in the user's browser, not from the container. The simulator is the opposite - it runs
# inside the Docker network, so it reaches the API by its service name.

services:
  smartx-api:
    build:
      context: ./src
      dockerfile: SmartX.Api/Dockerfile
    container_name: smartx-api
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AllowedClientOrigins__0=http://localhost:5100
    volumes:
      - smartx-uploads:/app/App_Data/uploads
    restart: unless-stopped

  smartx-simulator:
    build:
      context: ./src
      dockerfile: SmartX.DeviceSimulator/Dockerfile
    container_name: smartx-simulator
    environment:
      - SMARTX_API_URL=http://smartx-api:8080
    depends_on:
      - smartx-api
    restart: unless-stopped

  smartx-client:
    build:
      context: ./src
      dockerfile: SmartX.Client/Dockerfile
    container_name: smartx-client
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://localhost:5050
    depends_on:
      - smartx-api
    restart: unless-stopped

volumes:
  smartx-uploads:
